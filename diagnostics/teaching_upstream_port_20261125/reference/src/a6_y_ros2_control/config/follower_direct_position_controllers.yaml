# Namespaced controller config for direct follower teleoperation.
# The follower runs in POS_VEL hardware mode and receives streaming position arrays.

/follower/controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    direct_position_controller:
      type: position_controllers/JointGroupPositionController

/follower/direct_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - gripper_finger_joint1
