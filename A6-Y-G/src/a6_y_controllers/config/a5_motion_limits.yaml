  joint2: {min_position: 0.0, max_position: 3.16, zero_tolerance: 0.03490658503988659, max_velocity: 0.5, max_effort: 20.0}
  # 2026-10-08: operator explicitly confirmed a 20 Nm total output limit.
  joint3: {min_position: 0.0, max_position: 3.16, zero_tolerance: 0.03490658503988659, max_velocity: 0.5, max_effort: 20.0}
  joint4: {min_position: -1.55, max_position: 1.55, zero_tolerance: 0.03490658503988659, max_velocity: 0.5, max_effort: 3.0}
  joint5: {min_position: -0.9, max_position: 0.9, zero_tolerance: 0.03490658503988659, max_velocity: 0.5, max_effort: 4.0}
  joint6: {min_position: -3.14, max_position: 3.14, zero_tolerance: 0.03490658503988659, max_velocity: 0.5, max_effort: 4.0}
