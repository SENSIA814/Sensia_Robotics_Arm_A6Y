# Arm motors for the A5 model with its complete wrist and gripper payload.
# q_urdf = sign * q_motor + offset; verify physical URDF zeros before enabling.
# J3's URDF axis changed from +Y to -Y, so its motor sign is reversed.
joints:
  joint1: {motor_type: DM4340P, slave_id: 0x01, master_id: 0x11, sign: -1.0, offset: 0.0, min_position: -2.62, max_position: 2.62, max_velocity: 0.5}
  joint2: {motor_type: DM4340P, slave_id: 0x02, master_id: 0x12, sign: 1.0, offset: 0.0, min_position: 0.0, max_position: 3.16, max_velocity: 0.5}
  joint3: {motor_type: DM4340P, protocol_vmax: 20.0, slave_id: 0x03, master_id: 0x13, sign: 1.0, offset: 0.0, min_position: 0.0, max_position: 3.16, max_velocity: 0.5}
  joint4: {motor_type: DM4310, protocol_vmax: 50.0, slave_id: 0x04, master_id: 0x14, sign: -1.0, offset: 0.0, min_position: -1.55, max_position: 1.55, max_velocity: 0.5}
  joint5: {motor_type: DM4310, protocol_vmax: 50.0, slave_id: 0x05, master_id: 0x15, sign: -1.0, offset: 0.0, min_position: -0.9, max_position: 0.9, max_velocity: 0.5}
  joint6: {motor_type: DM4310, protocol_vmax: 50.0, slave_id: 0x06, master_id: 0x16, sign: -1.0, offset: 0.0, min_position: -3.14, max_position: 3.14, max_velocity: 0.5}
  # A6-Y leader mapping: IDs 07/17, 0.0239 m/rad, 30 mm operating stroke.
  # A5 finger1 uses +Y with negative displacement, opposite to the old -Y joint.
  gripper_finger_joint1: {motor_type: DM3507, slave_id: 0x07, master_id: 0x17, sign: 1.0, offset: 0.0, position_scale: 0.0239, min_position: -0.03, max_position: 0.0, max_velocity: 0.1}
